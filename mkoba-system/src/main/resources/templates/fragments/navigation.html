<!DOCTYPE html>
<html lang="sw" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikoba - Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar Navigation Fragment -->
    <div th:fragment="navigation" class="col-md-2 sidebar p-0">
        <div class="p-3">
            <h4 class="text-center mb-4">
                <i class="fas fa-piggy-bank"></i> M-Koba
            </h4>
            
            <div class="text-center mb-4">
                <i class="fas fa-user-circle fa-3x"></i>
                <h6 class="mt-2" th:text="${user.fullName}">Jina La Mwanachama</h6>
                <small th:text="${user.role.displayName}">Mwanachama</small>
            </div>
            
            <nav class="nav flex-column">
                <a class="nav-link" href="/dashboard">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a class="nav-link" href="/dashboard/profile">
                    <i class="fas fa-user"></i> Wasifu Wangu
                </a>
                <a class="nav-link" href="/dashboard/savings">
                    <i class="fas fa-coins"></i> Akiba na Michango
                </a>
                <a class="nav-link" href="/dashboard/loans">
                    <i class="fas fa-hand-holding-usd"></i> Mikopo
                </a>
                <a class="nav-link" href="/dashboard/transactions">
                    <i class="fas fa-exchange-alt"></i> Miamala
                </a>
                <a class="nav-link" href="/dashboard/group-info">
                    <i class="fas fa-users"></i> Taarifa ya Kikundi
                </a>
                <a class="nav-link" href="/dashboard/reports">
                    <i class="fas fa-file-download"></i> Ripoti
                </a>
            </nav>
            
            <!-- Logout Button -->
            <div class="mt-4">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger w-100">
                        <i class="fas fa-sign-out-alt"></i> Toka
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
