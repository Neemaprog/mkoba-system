<!DOCTYPE html>
<html>
<head>
    <title>AzamPay API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 20px 0; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>AzamPay API Testing</h1>
    
    <h2>Test Savings Contribution</h2>
    <button onclick="testContribute()">Test Contribution (10,000 TZS)</button>
    
    <h2>Test Loan Disbursement</h2>
    <button onclick="testDisbursement()">Test Loan Disbursement</button>
    
    <h2>Test Loan Repayment</h2>
    <button onclick="testRepayment()">Test Loan Repayment (5,000 TZS)</button>
    
    <div id="result" class="result"></div>

    <script>
        function showResult(message, isSuccess = true) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error');
        }

        function testContribute() {
            showResult('Testing savings contribution...');
            
            fetch('/api/payments/contribute', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: 1,
                    amount: 10000,
                    phoneNumber: '255754123456'
                })
            })
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text(); // Get raw text first
            })
            .then(text => {
                console.log('Raw response:', text);
                if (text) {
                    return JSON.parse(text);
                } else {
                    return {message: "Empty response from server", status: "error"};
                }
            })
            .then(data => {
                showResult('✅ Contribution Success: ' + JSON.stringify(data, null, 2), true);
                console.log('Contribution Response:', data);
            })
            .catch(error => {
                showResult('❌ Contribution Error: ' + error.message, false);
                console.error('Contribution Error:', error);
            });
        }

        function testDisbursement() {
            showResult('Testing loan disbursement...');
            
            fetch('/api/payments/disburse/1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.text())
            .then(text => {
                console.log('Raw disbursement response:', text);
                if (text) {
                    return JSON.parse(text);
                } else {
                    return {message: "Empty response from server", status: "error"};
                }
            })
            .then(data => {
                showResult('✅ Disbursement Success: ' + JSON.stringify(data, null, 2), true);
                console.log('Disbursement Response:', data);
            })
            .catch(error => {
                showResult('❌ Disbursement Error: ' + error.message, false);
                console.error('Disbursement Error:', error);
            });
        }

        function testRepayment() {
            showResult('Testing loan repayment...');
            
            fetch('/api/payments/repay/1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    amount: 5000,
                    phoneNumber: '255754123456'
                })
            })
            .then(response => response.text())
            .then(text => {
                console.log('Raw repayment response:', text);
                if (text) {
                    return JSON.parse(text);
                } else {
                    return {message: "Empty response from server", status: "error"};
                }
            })
            .then(data => {
                showResult('✅ Repayment Success: ' + JSON.stringify(data, null, 2), true);
                console.log('Repayment Response:', data);
            })
            .catch(error => {
                showResult('❌ Repayment Error: ' + error.message, false);
                console.error('Repayment Error:', error);
            });
        }
    </script>
</body>
</html>
